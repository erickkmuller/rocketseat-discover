<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Links profissionais de Erick Muller."
    />
    <meta name="author" content="Erick Muller" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erick Muller | Links" />
    <meta
      property="og:description"
      content="Links profissionais de Erick Muller."
    />
    <meta property="og:image" content="./assets/avatar-light.png" />
    <title>Erick Muller | Links</title>

    <script>
      (() => {
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem("theme");
        } catch {}

        const systemTheme = window.matchMedia("(prefers-color-scheme: light)")
          .matches
          ? "light"
          : "dark";

        document.documentElement.classList.toggle(
          "light",
          (savedTheme || systemTheme) === "light"
        );
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
